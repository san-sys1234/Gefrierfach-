<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#263c35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Frostfach">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Frostfach – Mein Gefrierschrank</title>
<style>
:root{--ink:#382c27;--muted:#897d72;--cream:#f8f3eb;--paper:#fffdf9;--sage:#e8ece2;--green:#33684f;--line:#ebe3d9;--gold:#b98559;--rose:#f4e4df;--shadow:0 10px 28px rgba(36,58,51,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:0 auto;min-height:100dvh;padding:0 17px 35px}.hero{padding:27px 4px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:10px;color:var(--green);font-weight:800}.hero h1{font-family:Georgia,serif;font-weight:500;font-size:34px;letter-spacing:-.035em;margin:5px 0}.hero p{margin:0;color:var(--muted);font-size:13px}.logo{width:52px;height:52px;border-radius:18px;background:#f0e2d0;display:grid;place-items:center;font-size:27px;flex-shrink:0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 20px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 16px}.stat span{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:25px;font-family:Georgia,serif;font-weight:500;margin-top:3px}.tabs{display:flex;gap:7px;padding:5px;background:#f0e8dc;border-radius:15px;margin-bottom:15px}.tab{flex:1;border:0;background:transparent;border-radius:11px;padding:12px 8px;color:#68756d;font-weight:700;font-size:13px}.tab.active{background:var(--paper);color:var(--ink);box-shadow:0 2px 7px #243a3310}.toolbar{display:flex;gap:9px;margin-bottom:13px}.search{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:13px;padding:12px 13px;outline:none}.primary{border:0;background:var(--ink);color:white;border-radius:13px;padding:12px 16px;font-weight:700;white-space:nowrap}.secondary{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 12px;font-weight:650}.filterchips{display:flex;gap:7px;overflow-x:auto;margin:0 0 14px;padding:2px 1px 6px;scrollbar-width:none}.filterchips::-webkit-scrollbar{display:none}.chip{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:8px 12px;white-space:nowrap;font-size:12px;color:var(--ink)}.chip.active{background:var(--green);color:white;border-color:var(--green)}.items{display:grid;gap:9px}.item{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:13px 14px;box-shadow:0 3px 14px rgba(56,44,39,.035);display:flex;gap:12px;align-items:flex-start}.item-icon{width:42px;height:42px;border-radius:14px;background:#f7e9d9;display:grid;place-items:center;font-size:21px;flex-shrink:0}.item-main{flex:1;min-width:0}.item-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.item h3{margin:1px 0 5px;font-size:16px;font-weight:750;overflow-wrap:anywhere}.quantity{font-weight:800;font-size:13px;background:#f4eee6;border-radius:9px;padding:6px 8px;white-space:nowrap}.meta{font-size:12px;color:var(--muted);line-height:1.55}.note{font-size:12px;margin-top:6px;color:#586a60}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.actions button{font-size:12px;padding:8px 10px}.done{background:#e3eee1;color:#315b42;border:0;border-radius:10px;font-weight:750}.empty{padding:38px 18px;text-align:center;color:var(--muted);background:#ffffff80;border:1px dashed #d7ddd3;border-radius:18px}.empty .emoji{font-size:30px;margin-bottom:8px}.empty strong{display:block;color:var(--ink);margin-bottom:5px}.sectionline{display:flex;justify-content:space-between;align-items:center;margin:19px 2px 10px}.sectionline h2{font-size:15px;margin:0}.sectionline span{font-size:12px;color:var(--muted)}.footer{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:24px 0 8px}.footer button{font-size:12px}.modal-backdrop{position:fixed;inset:0;background:#17251fc2;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:5}.modal-backdrop.show{display:flex}.modal{background:var(--paper);width:100%;max-width:560px;border-radius:23px 23px 18px 18px;padding:22px;max-height:92dvh;overflow:auto;box-shadow:0 20px 70px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal h2{font-family:Georgia,serif;font-size:25px;font-weight:500;margin:0}.close{border:0;background:#eff0e9;border-radius:50%;width:34px;height:34px;font-size:20px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:750;color:#586a60}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe4da;background:white;border-radius:12px;padding:12px;outline:none;color:var(--ink)}.field textarea{min-height:72px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px #456c5919}.formbuttons{display:flex;gap:8px;margin-top:18px}.formbuttons button{flex:1;padding:13px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 17px;border-radius:12px;font-size:13px;box-shadow:var(--shadow);z-index:10;display:none;max-width:90vw}.smallprint{font-size:11px;color:var(--muted);text-align:center;line-height:1.5;margin-top:12px}
@media(min-width:600px){.app{padding-left:26px;padding-right:26px}.hero{padding-top:35px}.modal-backdrop{align-items:center}.modal{border-radius:23px}.items{grid-template-columns:1fr}.item{min-height:0}}
</style>
</head>
<body>
<div class="app">
<header class="hero"><div><div class="eyebrow">Dein Vorrat, ganz entspannt</div><h1>Frostfach</h1><p>Alles griffbereit. Nichts vergessen.</p></div><div class="logo">✳</div></header>
<div class="stats"><div class="stat"><span>Im Gefrierschrank</span><strong id="activeCount">0</strong></div><div class="stat"><span>Aufgebraucht</span><strong id="usedCount">0</strong></div></div>
<nav class="tabs"><button class="tab active" data-tab="active">❄️ Im Gefrierschrank</button><button class="tab" data-tab="used">✓ Aufgebraucht</button></nav>
<div class="toolbar"><input class="search" id="search" placeholder="Produkt suchen …" aria-label="Produkt suchen"><button class="primary" id="addBtn">＋ Hinzufügen</button></div>
<div id="filters" class="filterchips" aria-label="Kategorien filtern"></div><div id="filters" class="filters"></div><div id="content"></div>
<div class="footer"><button class="secondary" id="exportBtn">Daten exportieren</button><button class="secondary" id="importBtn">Daten importieren</button><button class="secondary" id="allDeleteBtn">Alle Daten löschen</button><input type="file" id="importFile" accept="application/json" hidden></div>
<div class="smallprint">Deine Einträge werden auf diesem Gerät gespeichert. Exportiere regelmäßig eine Sicherung, wenn du die App auf mehreren Geräten nutzen möchtest.</div>
</div>
<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">Produkt hinzufügen</h2><button class="close" id="closeModal" aria-label="Schließen">×</button></div><form id="itemForm"><div class="formgrid">
<div class="field full"><label for="name">Produktname *</label><input id="name" required maxlength="100" placeholder="z. B. Hühnerbrust"></div>
<div class="field"><label for="quantity">Menge *</label><input id="quantity" required type="number" min="0.01" step="any" placeholder="z. B. 500"></div>
<div class="field"><label for="unit">Einheit</label><select id="unit"><option>g</option><option>kg</option><option>ml</option><option>l</option><option>Stück</option><option>Portionen</option><option>Packungen</option><option>Beutel</option><option>Schalen</option></select></div>
<div class="field"><label for="addedDate">Eingefroren am</label><input id="addedDate" type="date"></div>
<div class="field"><label for="category">Kategorie</label><select id="category"><option value="">Keine Kategorie</option><option>Fleisch & Geflügel</option><option>Fisch</option><option>Gemüse & Obst</option><option>Brot & Gebäck</option><option>Fertiggerichte</option><option>Reste</option><option>Kräuter</option><option>Sonstiges</option></select></div>
<div class="field full"><label for="location">Fach / Ort (optional)</label><input id="location" maxlength="80" placeholder="z. B. oberes Fach, Schublade 2"></div>
<div class="field full"><label for="notes">Notizen (optional)</label><textarea id="notes" maxlength="400" placeholder="z. B. gewürzt, für Lasagne …"></textarea></div>
</div><div class="formbuttons"><button type="button" class="secondary" id="cancelForm">Abbrechen</button><button type="submit" class="primary">Speichern</button></div></form></section></div>
<div class="modal-backdrop" id="usedBackdrop"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>Menge verwenden</h2><button class="close" id="closeUsed">×</button></div><p id="usedProductLabel" style="color:var(--muted);margin-top:0"></p><form id="usedForm"><div class="formgrid"><div class="field full"><label for="usedQuantity">Verwendete Menge *</label><input id="usedQuantity" type="number" min="0.01" step="any" required></div><div class="field full"><label for="usedDate">Verwendet am *</label><input id="usedDate" type="date" required></div><div class="field full"><label for="usedNote">Notiz (optional)</label><input id="usedNote" maxlength="180" placeholder="z. B. für Bolognese verwendet"></div></div><div class="formbuttons"><button type="button" class="secondary" id="cancelUsed">Abbrechen</button><button type="submit" class="primary">Menge verbuchen</button></div></form></section></div>
<div class="toast" id="toast"></div>
<script>
const KEY='frostfach-v1';
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const fmt=d=>{if(!d)return '–';const p=d.split('-');return p.length===3?`${p[2]}.${p[1]}.${p[0]}`:d};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let items=[],tab='active',categoryFilter='',editingId=null,usingId=null;
try{items=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(items))items=[]}catch{items=[]}
function save(){localStorage.setItem(KEY,JSON.stringify(items));render()}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',2600)}
function iconFor(c){return ({'Fleisch & Geflügel':'🥩','Fisch':'🐟','Gemüse & Obst':'🥦','Brot & Gebäck':'🍞','Fertiggerichte':'🍲','Reste':'🍱','Kräuter':'🌿','Sonstiges':'🧊'})[c]||'🧊'}
function render(){
 const active=items.filter(x=>!x.usedAt),used=items.filter(x=>x.usedAt);
 document.getElementById('activeCount').textContent=active.length;document.getElementById('usedCount').textContent=used.length;
 const q=document.getElementById('search').value.trim().toLowerCase();
 const cats=['',...new Set((tab==='active'?active:used).map(x=>x.category).filter(Boolean))];if(!cats.includes(categoryFilter))categoryFilter='';document.getElementById('filters').innerHTML=cats.map(c=>`<button class="chip ${categoryFilter===c?'active':''}" data-category="${esc(c)}">${c?esc(c):'Alle'}</button>`).join('');const arr=(tab==='active'?active:used).filter(x=>(!categoryFilter||x.category===categoryFilter)&&[x.name,x.category,x.location,x.notes].join(' ').toLowerCase().includes(q)).sort((a,b)=>tab==='active'?(a.addedDate||'9999').localeCompare(b.addedDate||'9999'): (b.usedAt||'').localeCompare(a.usedAt||''));
 const content=document.getElementById('content');
 if(!arr.length){content.innerHTML=`<div class="empty"><div class="emoji">${tab==='active'?'🧊':'✨'}</div><strong>${q?'Keine Treffer gefunden':tab==='active'?'Dein Gefrierschrank ist noch leer.':'Noch nichts aufgebraucht.'}</strong><span>${q?'Versuche einen anderen Suchbegriff.':tab==='active'?'Füge dein erstes Produkt hinzu.':'Verwendete Produkte erscheinen hier mit Datum.'}</span></div>`;return}
 content.innerHTML='<div class="items">'+arr.map(x=>`<article class="item"><div class="item-icon">${iconFor(x.category)}</div><div class="item-main"><div class="item-top"><div><h3>${esc(x.name)}</h3><div class="meta">${esc(x.category||'Ohne Kategorie')} ${x.addedDate?' · Eingefroren: '+fmt(x.addedDate):''}</div></div><span class="quantity">${esc(x.quantity)} ${esc(x.unit)}${!x.usedAt?' übrig':''}</span></div>${!x.usedAt&&x.initialQuantity>x.quantity?`<div class="meta">Ursprünglich ${esc(x.initialQuantity)} ${esc(x.unit)} · ${Math.round(x.quantity/x.initialQuantity*100)} % übrig</div>`:''}${!x.usedAt&&Number(x.originalQuantity)>Number(x.quantity)?`<div class="meta" style="margin:6px 0">Noch ${esc(x.quantity)} von ${esc(x.originalQuantity)} ${esc(x.unit)} <span style="display:inline-block;vertical-align:middle;width:75px;height:5px;background:#e9e6df;border-radius:5px;overflow:hidden"><span style="display:block;height:100%;background:var(--green);width:${Math.max(0,Math.min(100,100*x.quantity/x.originalQuantity))}%"></span></span></div>`:''}${x.location?`<div class="meta">📍 ${esc(x.location)}</div>`:''}${x.notes?`<div class="note">${esc(x.notes)}</div>`:''}${x.usedAt?`<div class="meta" style="margin-top:8px">✓ Vollständig aufgebraucht am ${fmt(x.usedAt)}${x.usedNote?' · '+esc(x.usedNote):''}</div>`:''}${x.usageHistory?.length?`<div class="note">Zuletzt verwendet: ${x.usageHistory.slice(-3).map(h=>`${esc(h.quantity)} ${esc(x.unit)} am ${fmt(h.date)}${h.note?' ('+esc(h.note)+')':''}`).join(' · ')}</div>`:''}<div class="actions">${!x.usedAt?`<button class="done" data-use="${x.id}">− Menge verwenden</button>`:`<button class="secondary" data-restore="${x.id}">↶ Zurücklegen</button>`}<button class="secondary" data-edit="${x.id}">Bearbeiten</button><button class="secondary" data-delete="${x.id}">Löschen</button></div></div></article>`).join('')+'</div>';
}
function openEditor(id=null){editingId=id;const x=id?items.find(i=>i.id===id):null;document.getElementById('modalTitle').textContent=x?'Produkt bearbeiten':'Produkt hinzufügen';document.getElementById('name').value=x?.name||'';document.getElementById('quantity').value=x?.quantity??'';document.getElementById('unit').value=x?.unit||'g';document.getElementById('addedDate').value=x?.addedDate||today();document.getElementById('category').value=x?.category||'';document.getElementById('location').value=x?.location||'';document.getElementById('notes').value=x?.notes||'';document.getElementById('modalBackdrop').classList.add('show');setTimeout(()=>document.getElementById('name').focus(),80)}
function closeEditor(){document.getElementById('modalBackdrop').classList.remove('show')}
function openUsed(id){usingId=id;const x=items.find(i=>i.id===id);const q=document.getElementById('usedQuantity');q.max=x.quantity;q.value=x.quantity;q.step='any';q.setAttribute('aria-label',`Verwendete Menge in ${x.unit}`);document.querySelector('label[for="usedQuantity"]').textContent=`Verwendete Menge (${x.unit}; verfügbar: ${x.quantity} ${x.unit}) *`;document.getElementById('usedProductLabel').textContent=`${x.name} · aktuell ${x.quantity} ${x.unit} vorhanden. Du kannst eine Teilmenge oder die gesamte Restmenge eintragen.`;document.getElementById('usedDate').value=today();document.getElementById('usedNote').value='';document.getElementById('usedBackdrop').classList.add('show')}
function closeUsed(){document.getElementById('usedBackdrop').classList.remove('show')}
document.getElementById('addBtn').onclick=()=>openEditor();document.getElementById('closeModal').onclick=closeEditor;document.getElementById('cancelForm').onclick=closeEditor;document.getElementById('closeUsed').onclick=closeUsed;document.getElementById('cancelUsed').onclick=closeUsed;document.getElementById('search').oninput=render;document.getElementById('filters').onclick=e=>{const b=e.target.closest('[data-category]');if(b){categoryFilter=b.dataset.category;render()}};document.getElementById('filters').onclick=e=>{const b=e.target.closest('button[data-category]');if(b){categoryFilter=b.dataset.category;render()}};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(n=>n.classList.toggle('active',n===b));render()});
document.getElementById('itemForm').onsubmit=e=>{e.preventDefault();const data={name:document.getElementById('name').value.trim(),quantity:Number(document.getElementById('quantity').value),unit:document.getElementById('unit').value,addedDate:document.getElementById('addedDate').value,category:document.getElementById('category').value,location:document.getElementById('location').value.trim(),notes:document.getElementById('notes').value.trim()};if(!data.name||!Number.isFinite(data.quantity)||data.quantity<=0)return; if(editingId){const i=items.findIndex(x=>x.id===editingId);items[i]={...items[i],...data,originalQuantity:Math.max(Number(items[i].originalQuantity||0),data.quantity)}}else items.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),...data,initialQuantity:data.quantity,createdAt:new Date().toISOString()});closeEditor();save();toast(editingId?'Änderungen gespeichert':'Produkt hinzugefügt')};
document.getElementById('usedForm').onsubmit=e=>{e.preventDefault();const i=items.findIndex(x=>x.id===usingId);if(i<0)return;const x=items[i],amount=Number(document.getElementById('usedQuantity').value),date=document.getElementById('usedDate').value,note=document.getElementById('usedNote').value.trim();if(!Number.isFinite(amount)||amount<=0){alert('Bitte eine Menge größer als 0 eingeben.');return}if(amount>x.quantity+1e-9){alert(`Du hast nur noch ${x.quantity} ${x.unit} verfügbar.`);return}x.usageHistory=Array.isArray(x.usageHistory)?x.usageHistory:[];x.initialQuantity=x.initialQuantity||x.quantity;x.usageHistory.push({quantity:amount,date,note});const remaining=Math.max(0,Number((x.quantity-amount).toFixed(6)));if(remaining<=1e-9){x.quantity=amount;x.usedAt=date;x.usedNote=note;x.usedQuantity=amount;tab='used';document.querySelectorAll('.tab').forEach(n=>n.classList.toggle('active',n.dataset.tab===tab));}else{x.quantity=remaining;tab='active';document.querySelectorAll('.tab').forEach(n=>n.classList.toggle('active',n.dataset.tab===tab));}closeUsed();save();toast(remaining<=1e-9?'Vollständig aufgebraucht – im Verlauf gespeichert':`Verbrauch gebucht · ${remaining} ${x.unit} übrig`)};
document.getElementById('content').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.use||b.dataset.edit||b.dataset.delete||b.dataset.restore;if(!id)return;const x=items.find(i=>i.id===id);if(b.dataset.use)openUsed(id);if(b.dataset.edit)openEditor(id);if(b.dataset.delete&&confirm(`„${x.name}“ wirklich löschen?`)){items=items.filter(i=>i.id!==id);save();toast('Produkt gelöscht')}if(b.dataset.restore){x.usedAt=null;x.usedNote='';tab='active';document.querySelectorAll('.tab').forEach(n=>n.classList.toggle('active',n.dataset.tab===tab));save();toast('Produkt zurückgelegt')}};
document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'Frostfach',version:1,exportedAt:new Date().toISOString(),items},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`frostfach-sicherung-${today()}.json`;a.click();URL.revokeObjectURL(a.href);toast('Sicherung exportiert')};
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());const incoming=Array.isArray(data)?data:data.items;if(!Array.isArray(incoming))throw Error('Format');if(confirm('Import ersetzt die aktuell gespeicherten Einträge. Vorher am besten exportieren. Fortfahren?')){items=incoming;save();toast('Daten importiert')}}catch{alert('Die Datei konnte nicht gelesen werden. Bitte eine Frostfach-JSON-Sicherung wählen.')}e.target.value=''};
document.getElementById('allDeleteBtn').onclick=()=>{if(confirm('Wirklich alle Produkte und den Verlauf unwiderruflich löschen?')){items=[];save();toast('Alle Daten gelöscht')}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeEditor();closeUsed()}});
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script>
</body>
</html>
